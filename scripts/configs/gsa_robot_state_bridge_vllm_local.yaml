# Bridge-only A_robot_state local vLLM configuration.
# Use with:
#   bash scripts/run_gsa_with_local_vllm.sh --config scripts/configs/gsa_robot_state_bridge_vllm_local.yaml --max-images 10

vlm:
  base_url: "${VLLM_BASE_URL:-http://localhost:10301/v1}"
  model: "${VLLM_MODEL:-/path/to/workspace/foundation/contributor/hf_models/Qwen/Qwen2.5-VL-7B-Instruct}"
  api_key: ""
  max_image_size: 1280
  timeout: 300
  concurrency: "${GSA_VLM_CONCURRENCY:-1}"
  max_retries: 2

input:
  image_dirs:
    - "/path/to/datasets/downloads/bridge_data_v2/images"
  discover_external_sources: false
  business_log_dirs: []
  anchor_set_path: "data/anchor/gsa_anchors_v0.jsonl"
  max_images: "${GSA_MAX_IMAGES:-10}"

pipeline:
  concurrency: "${GSA_PIPELINE_CONCURRENCY:-1}"
  enabled_stages:
    - G
    - S
    - A_robot_state

output:
  root: "data/output/gsa_v0"

scene_families:
  delivery:
    keywords: ["deliver", "hand", "give", "take", "receive", "pass"]
    scenario: "SC.1"
  tabletop_tidy:
    keywords: ["table", "desk", "tidy", "clean", "arrange", "organize", "bridge"]
    scenario: "SC.2"
  storage:
    keywords: ["store", "put away", "shelf", "cabinet", "drawer", "container"]
    scenario: "SC.3"

quotas:
  G: 100
  S: 100
  A_robot_state: 500

robot_state_datasets:
  enabled: []
  ingest_only: false
  max_samples_per_source: 0

verifier:
  auto_pass_confidence: 0.8
  review_threshold: 0.5
  delete_threshold: 0.2

review_queue:
  max_per_bucket: 500
  priority_subtypes:
    - gripper_empty
    - holding_object
    - object_between_fingers
    - contact_state
    - tool_ready

sources:
  vlm_generated:
    status: "ready"
    priority: 1

ports:
  viewer: 10303
  vlm_local: 10301
