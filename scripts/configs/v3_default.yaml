# Rex-Embodied v3.0 默认配置
# 用法: python -m apps.data_flywheel.pipeline --v3 --source-config scripts/configs/v3_default.yaml

flywheel:
  capabilities: [G, S, A, R, P, F, H, E, Aff]
  num_gpus: null  # null = 自动检测
  use_ray: true
  verifier_threshold: 0.7
  verifier_margin: 0.1

sources:
  - path: ./raw_data/test/
    source_type: image_dir
    weight: 1.0

scheduler:
  backend: auto  # ray / multiprocessing / sequential / auto
  timeout_per_sample: 60
  max_retries: 2

verifier:
  enabled: false  # Phase 2 启用
  model_path: null
  backend: vllm
  batch_size: 16

export:
  output_root: data/output
  format: jsonl
  include_visualizations: true

wandb:
  project: rex-embodied-flywheel
  enabled: false  # 需要 WANDB_API_KEY
