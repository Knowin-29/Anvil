  # Each model uses an OpenAI-compatible /chat/completions endpoint. endpoint can
  # use environment placeholders such as ${VLM_URL}; api_key_env names the env var
  # that stores the Bearer token. Leave api_key_env empty for no-key services.
  # Per-model temperature/max_tokens/system_prompt/chat_template_kwargs are
  # optional and are passed through to the request payload when configured.
  models:
    # Qwen3.6 local service: no API key, disable thinking for deterministic bbox output.
    - name: qwen3_6_27b
      endpoint: "http://127.0.0.1:8181/v1"
      api_key_env: ""
      model: "Qwen/Qwen3.6-27B"
      system_prompt: "You are a helpful AI assistant."
      temperature: 0
      max_tokens: 512
      chat_template_kwargs:
        enable_thinking: false
      enabled: true

    # Volc API service: put the hidden token in VOLC_API_KEY, not in this file.
    - name: volc_llm
      endpoint: "${VOLC_API_URL}"
      api_key_env: "VOLC_API_KEY"
      model: "LLM"
      system_prompt: "You are a helpful AI assistant."
      temperature: 0.6
      max_tokens: 8192
      chat_template_kwargs:
        enable_thinking: false
      enabled: true

