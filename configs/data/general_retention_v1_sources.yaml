adapter:
  implementation: open-compass/VLMEvalKit
  revision: 122bc8074c542867425fb463a1dd2f10932fc6f4
  revision_date_utc: '2026-08-24T02:25:31Z'
  repository: https://github.com/open-compass/VLMEvalKit
  crosswalk_policy:
    exact_or_transcoded_image:
      acceptance: exact_bytes_or_exact_pillow_default_jpeg
      require_equal_dimensions: true
      deterministic_transform: >-
        PIL.Image.open(path), mode conversion as in VLMEvalKit vlm.py when
        required, then Image.save(BytesIO(), format='JPEG') with Pillow
        defaults. Admission requires the transformed SHA-256 to equal the
        adapter image SHA-256 exactly; perceptual distances are descriptive.
    ai2d_notebook_replay:
      acceptance: pinned_notebook_transform_replay
      notebook_definition: first_cover_image_definition
      font_path: data/general_retention_v1/sources/vlmevalkit/timesb.ttf
      normalized_thumbnail: 64x64_rgb_lanczos
      max_normalized_rgb_mae: 0.02
      min_grayscale_correlation: 0.99
      sensitivity_gates:
        - {max_normalized_rgb_mae: 0.002, min_grayscale_correlation: 0.9999}
        - {max_normalized_rgb_mae: 0.005, min_grayscale_correlation: 0.999}
        - {max_normalized_rgb_mae: 0.01, min_grayscale_correlation: 0.995}
        - {max_normalized_rgb_mae: 0.02, min_grayscale_correlation: 0.99}
        - {max_normalized_rgb_mae: 0.03, min_grayscale_correlation: 0.98}
      note: >-
        The frozen AI2D_TEST transport matches the notebook's first
        cover_image definition. Replay is transformation-aware and tolerates
        only font/JPEG rasterizer drift under the declared pixel gate; pHash is
        not an admission criterion.
    ai2d_labeled_derivative:
      acceptance: metadata_and_pinned_notebook_replay
      require_equal_dimensions: true
      binding_fields:
        - adapter_index
        - question
        - choices
        - answer
        - image_id
        - abcLabel
        - upstream_is_abc
        - image_path
      note: >-
        AI2D_TEST applies the pinned AI2D_preproc.ipynb `is_abc` rule to
        abcLabel=true questions; only selected rows transport a labeled/masked
        derivative under ai2d/images_abc/<image_id>.png. These rows are admitted
        by exact primary metadata, the reproduced `is_abc` decision and path,
        equal dimensions, the pinned adapter file hash, and a frozen row-mapping
        digest. Their perceptual distances are descriptive and are not
        presented as raw-image identity.
  transport_note: >-
    The OpenXLab distribution endpoint presented an expired TLS certificate on
    2026-08-24. Files were fetched with certificate verification disabled, then
    admitted only by the VLMEvalKit-pinned MD5 and the primary-data crosswalk.
