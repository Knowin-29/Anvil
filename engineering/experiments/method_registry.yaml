schema_version: anvil-method-registry-v1
status: control_runtime_implemented_experiments_pending
submission_ready: false
created_on: 2026-09-04
notice: >-
  This file freezes method identities and matched-control semantics. It contains
  no observations or checkpoint claims. A method becomes result-eligible only
  after its immutable config and checkpoint hashes enter result_registry.yaml.

runtime_controls:
  entry: engineering/worktree/scripts/run_mopd_9b_lora_l20.sh
  enable: ANVIL_MTD=1
  common_objective: stage_normalized_reference_sft_plus_residual_preserving_jsd
  teacher_qualification: unchanged_required_before_model_loading
  implemented_presets:
    flat: {ANVIL_ROUTING_MODE: flat, ANVIL_STRUCTURAL_ALPHA: 0}
    structural: {ANVIL_ROUTING_MODE: structural, ANVIL_STRUCTURAL_ALPHA: 2}
    declared: {ANVIL_ROUTING_MODE: declared, ANVIL_STRUCTURAL_ALPHA: 2}
    semantic_uniform: {ANVIL_ROUTING_MODE: semantic, ANVIL_STRUCTURAL_ALPHA: 0}
    semantic_weighted: {ANVIL_ROUTING_MODE: semantic, ANVIL_STRUCTURAL_ALPHA: 2}
  full_9b_training_verified: false
  matched_budget_suite_verified: false
  budget_note: >-
    The runtime logs actual teacher forwards and scored positions. Different
    selectors can select different populations and span lengths. Shared settings
    alone do not prove equality of realized student/teacher token budgets.
    These five complete-recipe controls do not inherit selector-only eligibility.

shared_budget_contract:
  match:
    - initialization
    - train_manifest_revision
    - data_order
    - student_tokens
    - teacher_scored_tokens
    - teacher_queries
    - optimizer_updates
    - trainable_parameters
    - maximum_sequence_length
    - decoding_and_rollout_policy
  teacher_budget_population: route_eligible_examples_only
  task_graph_source: immutable_record_fields_not_free_text
  descriptive_seeds: [17, 29, 43]
  core_routing_inference_seeds: [17, 29, 43, 71, 101, 113, 127, 149]
  minimum_seeds_for_sub_1pp_primary_effect: 5

selector_only_contract:
  linked_scan_policy:
    traversal: declared_topological_order
    stage_reachable_if: all_declared_predecessors_structural_and_semantic_pass
    stop_states: [structural_invalid, semantic_failure, indeterminate_low_confidence]
    indeterminate_action: skip_mtd_retain_sft
    downstream_evaluation_after_indeterminate: forbidden
  fixed_across_arms:
    - initialization
    - train_manifest_revision
    - data_order
    - frozen_student_rollout
    - route_eligibility_population
    - teacher_bank_and_qualification_revision
    - teacher_queries
    - teacher_scored_tokens
    - selected_stage_span_definition
    - generalized_jsd_divergence
    - top_k_support
    - stage_length_normalization
    - structural_token_weighting
    - sft_mtd_mixture
    - all_pass_skip_mtd_retain_sft
    - indeterminate_skip_mtd_retain_sft
  only_variable: selector_rule
  dynamic_effect_population: route_eligible_linked_traces

